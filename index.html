
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Echoes of a Memory</title>
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>

  <main class="poem">
    <p class="eyebrow">An interactive poem</p>

    <h1>Echoes of a Memory</h1>

    <section class="words" aria-label="Interactive poem">
      <button class="word" type="button">Your</button>
      <button class="word" type="button">voice</button>
      <button class="word" type="button">fades</button>
      <button class="word" type="button">through</button>
      <button class="word" type="button">distance</button>
    </section>

    <p class="message" aria-live="polite">
      Even silence carries an echo.
    </p>

    <p class="hint">
      Click a word to change the way the memory feels.
    </p>
  </main>

  <script src="assets/js/main.js"></script>
</body>
</html>
